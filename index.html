<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherstation One</title>
    <link href="style.css" rel="stylesheet">
    <link href="./styles/typography.css" rel="stylesheet">
    <link href="./styles/mediaquery.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <div class="headline">
            <h1>Weather<span>station</span> One</h1>
            <p id="timestamp"></p>
        </div>
    </header>
    <main>
        <div class="card-wrapper">
            <section class="temperature">
                <div class="value-card temperature-card">
                    <div class="value-headline temperature-headline">
                        <p class="title">temperature</p>
                    </div>
                    <div class="value-underline temperature-underline">
                        <p class="principal-value"></p>
                        <p class="changed-value">falling - -0.8 Grad/h</p>
                    </div>
                </div>
            </section>
            <section class="humidity">
                <div class="value-card humidity-card">
                    <div class="value-headline humidity-headline">
                        <p class="title">humidity</p>
                    </div>
                    <div class="value-underline humidity-underline">
                        <p class="principal-value"></p>
                        <p class="changed-value">rising - +1.0 %/h</p>
                    </div>
                </div>
            </section>
            <section class="air-pressure">
                <div class="value-card air-pressure-card">
                    <div class="value-headline air-pressure-headline">
                        <p class="title">air-pressure</p>
                    </div>
                    <div class="value-underline air-pressure-underline">
                        <p class="principal-value"></p>
                        <p class="changed-value">rising - +0,5 hPa/h</p>
                    </div>
                </div>
            </section>
        </div>
        <section class="temperature-chart">
            <div class="temperature-chart-headline">
                <h2>temperature</h2>
                <p>Last 20 minutes, measured minutly</p>
            </div>
            <div class="temperature-chart-area">
                <canvas id="temperatureChart"></canvas>
            </div>
        </section>
        <section class="latest-measurements">
            <div class="latest-measurements-headline">
                <h2>latest-measurements</h2>
            </div>
            <div class="latest-measurements-table">
                <div class="latest-measurements-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Zeit</th>
                                <th>Temperatur</th>
                                <th>Luftfeuchtigkeit</th>
                                <th>Luftdruck</th>
                            </tr>
                        </thead>
                        <tbody id="messungenTabelle">
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <p>ESP32 · BME280 · Transmission via Wi-Fi to Supabase · Demo-Data</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
