<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherstation One</title>
    <link src="style.css" rel="stylesheet">
    <script src="script.js"></script>
</head>

<body>
    <header>
        <div class="headline">
            <h1>Weatherstation One</h1>
            <p>Online - balcony</p>
            <p>Updated 2 minutes ago</p>
        </div>
    </header>
    <main>
        <section class="temperature">
            <div class="temperature-card">
                <div>
                    <p>temperature</p>
                    <img src="#" alt="temperature">
                </div>
                <div>
                    <h2>6.9 Grad</h2>
                    <p>falling - -0.8 Grad/h</p>
                </div>
            </div>
        </section>
        <section class="humidity">
            <div class="humidity-card">
                <div>
                    <p>humidity</p>
                    <img src="#" alt="humidity">
                </div>
                <div>
                    <h2>78 %</h2>
                    <p>rising - +1.0 %/h</p>
                </div>
            </div>
        </section>
        <section class="air-pressure">
            <div class="air-pressure-card">
                <div>
                    <p>air-pressure</p>
                    <img src="#" alt="air-pressure">
                </div>
                <div>
                    <h2>1016.5 hPa</h2>
                    <p>rising - +0,5 hPa/h</p>
                </div>
            </div>
        </section>
        <section class="temperature-chart">
            <div class="temperature-chart-headline">
                <h3>temperature</h3>
                <p>Last 24 hours, measured hourly</p>
            </div>
            <div class="temperature-chart-area">

            </div>
        </section>
        <section class="latest-measurements">
            <div class="latest-measurements-headline">
                <h3>latest-measurements</h3>
            </div>
            <div class="latest-measurements-table">

            </div>
        </section>
    </main>
</body>

</html>
